<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate - Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>StudyMate 📚</h1>
        <p>Your personal study planner</p>
    </header>

    <main class="container">

        <section class="welcome">
            <h2>Welcome, Student! 👋</h2>
            <p>Plan your day and achieve your goals.</p>
        </section>

        <section class="stats">
            <div class="stat-card">
                <h3 id="totalTasks">0</h3>
                <p>Total Tasks</p>
            </div>

            <div class="stat-card">
                <h3 id="completedTasks">0</h3>
                <p>Completed</p>
            </div>

            <div class="stat-card">
                <h3 id="pendingTasks">0</h3>
                <p>Pending</p>
            </div>
        </section>

        <section class="task-form">
            <h2>Add a Study Task</h2>
            <input type="text" id="taskInput" placeholder="Enter your task">
            <input type="text" id="subjectInput" placeholder="Enter subject">
            <input type="date" id="dateInput">
            <button id="addButton">Add Task +</button>
        </section>

        <section class="task-section">
            <h2>My Study Tasks</h2>
            <div id="taskList"></div>
        </section>

        <section class="progress-section">
            <h2>My Progress</h2>
            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>
            <p id="progressText">0% Completed</p>
        </section>

    </main>

    <footer>
        <p>Made with ❤️ by Shifna Sherine T</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
